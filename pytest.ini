[pytest]
testpaths = tests server/tests
addopts = -ra

# Phase T: the previous full run reported ~3200 warnings. They were traced to
# exactly one source: joblib's numpy_pickle uses `array.shape = ...`, which
# NumPy 2.5 deprecates. That is a third-party incompatibility inside joblib's
# own unpickling code, not a defect in this project, and it cannot be fixed
# here. It is filtered by its precise message and module so that every other
# warning (including any NumPy deprecation raised by our code) still surfaces.
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle

markers =
    slow: exercises real model artifacts or full datasets
    requires_dataset: needs dataset/ in the checkout
